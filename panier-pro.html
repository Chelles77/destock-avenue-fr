<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panier - Destock Avenue</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #e41e24;
            --dark: #1a1a1a;
            --gray-light: #f5f5f5;
            --gray-border: #ddd;
            --text: #333;
            --text-light: #666;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: white;
            color: var(--text);
        }

        /* HEADER */
        header {
            background: white;
            border-bottom: 1px solid var(--gray-border);
            padding: 1rem 0;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
        }

        .header-actions {
            display: flex;
            gap: 1.5rem;
        }

        .header-link {
            text-decoration: none;
            color: var(--text);
            font-weight: 500;
            transition: color 0.2s;
        }

        .header-link:hover {
            color: var(--primary);
        }

        /* BREADCRUMB */
        .breadcrumb-section {
            background: white;
            padding: 1.5rem 0;
            border-bottom: 1px solid var(--gray-border);
        }

        .breadcrumb {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            font-size: 0.9rem;
        }

        .breadcrumb-step {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .breadcrumb-number {
            background: var(--dark);
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .breadcrumb-number.inactive {
            background: var(--gray-border);
            color: var(--text-light);
        }

        .breadcrumb-text {
            color: var(--text-light);
            font-size: 0.85rem;
        }

        .breadcrumb-text.active {
            color: var(--text);
            font-weight: 600;
        }

        /* CONTAINER */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        /* MAIN GRID */
        .cart-main {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 2rem;
        }

        /* CART SECTION */
        .cart-section {
            background: white;
        }

        .empty-cart {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-light);
        }

        .empty-cart p {
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }

        .btn-continue-shopping {
            background: var(--dark);
            color: white;
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: opacity 0.2s;
        }

        .btn-continue-shopping:hover {
            opacity: 0.9;
        }

        /* TABLE */
        .cart-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 2rem;
        }

        .cart-table thead {
            background: white;
            border-bottom: 2px solid var(--gray-border);
        }

        .cart-table th {
            padding: 1rem;
            text-align: left;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text);
            border-bottom: 2px solid var(--gray-border);
        }

        .cart-table td {
            padding: 1.5rem 1rem;
            border-bottom: 1px solid var(--gray-border);
            font-size: 0.95rem;
        }

        .product-col {
            display: flex;
            gap: 1rem;
            align-items: flex-start;
        }

        .product-image {
            width: 60px;
            height: 60px;
            object-fit: cover;
            background: var(--gray-light);
            border-radius: 4px;
        }

        .product-details h4 {
            font-size: 0.95rem;
            margin-bottom: 0.25rem;
            font-weight: 600;
        }

        .product-sku {
            font-size: 0.8rem;
            color: var(--text-light);
        }

        .qty-input {
            width: 50px;
            padding: 0.4rem;
            border: 1px solid var(--gray-border);
            border-radius: 4px;
            text-align: center;
            font-weight: 600;
        }

        .remove-link {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .remove-link:hover {
            text-decoration: underline;
        }

        /* PROMO CODE */
        .promo-section {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .promo-input {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid var(--gray-border);
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .btn-promo {
            background: var(--dark);
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .btn-promo:hover {
            opacity: 0.9;
        }

        /* SUMMARY */
        .cart-summary {
            background: white;
            border: 1px solid var(--gray-border);
            border-radius: 4px;
            padding: 1.5rem;
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .summary-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--gray-border);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.75rem;
            font-size: 0.9rem;
        }

        .summary-row.total {
            font-size: 1.1rem;
            font-weight: 700;
            border-top: 1px solid var(--gray-border);
            padding-top: 0.75rem;
            margin-top: 0.75rem;
            color: var(--text);
        }

        .summary-row.shipping-note {
            font-size: 0.75rem;
            color: var(--text-light);
            margin-top: 1rem;
        }

        .btn-checkout {
            width: 100%;
            background: var(--dark);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.95rem;
            margin-top: 1.5rem;
            transition: opacity 0.2s;
        }

        .btn-checkout:hover:not(:disabled) {
            opacity: 0.9;
        }

        .btn-checkout:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-continue {
            width: 100%;
            background: white;
            color: var(--text);
            border: 1px solid var(--gray-border);
            padding: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            margin-top: 0.75rem;
            transition: all 0.2s;
        }

        .btn-continue:hover {
            background: var(--gray-light);
        }

        .info-box {
            background: var(--gray-light);
            padding: 0.75rem;
            border-radius: 4px;
            font-size: 0.8rem;
            color: var(--text-light);
            margin-top: 1rem;
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            .cart-main {
                grid-template-columns: 1fr;
            }

            .cart-summary {
                position: relative;
                top: 0;
            }

            .breadcrumb {
                flex-wrap: wrap;
                gap: 0.75rem;
            }

            .promo-section {
                flex-direction: column;
            }

            .cart-table {
                font-size: 0.85rem;
            }

            .cart-table td,
            .cart-table th {
                padding: 0.75rem 0.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header>
        <div class="header-content">
            <div class="logo">🔴 destock.</div>
            <div class="header-actions">
                <a href="login.html" class="header-link">👤 Connexion</a>
                <a href="panier-pro.html" class="header-link">🛒 Panier</a>
            </div>
        </div>
    </header>

    <!-- BREADCRUMB -->
    <div class="breadcrumb-section">
        <div class="breadcrumb">
            <div class="breadcrumb-step">
                <div class="breadcrumb-number">1</div>
                <div class="breadcrumb-text active">PANIER</div>
            </div>
            <span>></span>
            <div class="breadcrumb-step">
                <div class="breadcrumb-number inactive">2</div>
                <div class="breadcrumb-text">VÉRIFIER</div>
            </div>
            <span>></span>
            <div class="breadcrumb-step">
                <div class="breadcrumb-number inactive">3</div>
                <div class="breadcrumb-text">STATUT DE LA COMMANDE</div>
            </div>
        </div>
    </div>

    <!-- CONTENT -->
    <div class="container">
        <div class="cart-main">
            <!-- CART ITEMS -->
            <div class="cart-section">
                <table class="cart-table" id="cartTable" style="display: none;">
                    <thead>
                        <tr>
                            <th>Produits</th>
                            <th>Prix</th>
                            <th>SKU</th>
                            <th>Quantité</th>
                            <th>Sous-Total</th>
                        </tr>
                    </thead>
                    <tbody id="cartItems"></tbody>
                </table>

                <div id="emptyCart" class="empty-cart">
                    <p>🛒 Votre panier est vide</p>
                    <a href="index-pro.html" class="btn-continue-shopping">Continuer les achats</a>
                </div>

                <div class="promo-section" id="promoSection" style="display: none;">
                    <input type="text" class="promo-input" placeholder="Code promo" id="promoCode">
                    <button class="btn-promo" onclick="applyPromo()">D'AC</button>
                </div>
            </div>

            <!-- SUMMARY -->
            <div class="cart-summary">
                <div class="summary-title">Total Panier</div>
                <div class="summary-row">
                    <span>Sous-total</span>
                    <span id="subtotal">0.00€</span>
                </div>
                <div class="summary-row">
                    <span>Expédition</span>
                    <span id="shipping">Gratuite</span>
                </div>
                <div class="summary-row total">
                    <span>TOTAL</span>
                    <span id="total">0.00€</span>
                </div>
                <button class="btn-checkout" id="checkoutBtn" onclick="goToCheckout()">Passer À La Caisse</button>
                <button class="btn-continue" onclick="window.location.href='index-pro.html'">Continuer Vos Achats</button>
                <div class="info-box">
                    ✓ Livraison gratuite dès 50€<br>
                    ✓ Retour 30 jours<br>
                    ✓ Paiement sécurisé
                </div>
            </div>
        </div>
    </div>

    <script>
        function renderCart() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const cartTable = document.getElementById('cartTable');
            const cartItems = document.getElementById('cartItems');
            const emptyCart = document.getElementById('emptyCart');
            const promoSection = document.getElementById('promoSection');

            if (cart.length === 0) {
                cartTable.style.display = 'none';
                emptyCart.style.display = 'block';
                promoSection.style.display = 'none';
                updateSummary(cart);
                return;
            }

            cartTable.style.display = 'table';
            emptyCart.style.display = 'none';
            promoSection.style.display = 'flex';

            let html = '';
            cart.forEach((item, idx) => {
                const itemTotal = (item.price * item.qty).toFixed(2);
                html += `
                    <tr>
                        <td>
                            <div class="product-col">
                                <img src="https://picsum.photos/60/60?random=${idx}" alt="${item.name}" class="product-image">
                                <div class="product-details">
                                    <h4>${item.name}</h4>
                                    <div class="product-sku">SKU: ${Math.random().toString().substr(2, 6)}</div>
                                    <a href="javascript:void(0)" class="remove-link" onclick="removeItem(${idx})">Retirer</a>
                                </div>
                            </div>
                        </td>
                        <td>${item.price}€</td>
                        <td>${Math.random().toString().substr(2, 6)}</td>
                        <td>
                            <input type="number" class="qty-input" value="${item.qty}" onchange="setQty(${idx}, this.value)" min="1">
                        </td>
                        <td>${itemTotal}€</td>
                    </tr>
                `;
            });

            cartItems.innerHTML = html;
            updateSummary(cart);
        }

        function setQty(idx, value) {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart[idx].qty = Math.max(1, parseInt(value) || 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
        }

        function removeItem(idx) {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart.splice(idx, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
        }

        function updateSummary(cart) {
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0).toFixed(2);
            document.getElementById('subtotal').textContent = subtotal + '€';
            document.getElementById('total').textContent = subtotal + '€';
            document.getElementById('checkoutBtn').disabled = cart.length === 0;
        }

        function applyPromo() {
            alert('Code promo : En développement');
        }

        function goToCheckout() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            if (cart.length === 0) {
                alert('Votre panier est vide');
                return;
            }
            window.location.href = 'checkout-pro.html';
        }

        renderCart();
    </script>
</body>
</html>
