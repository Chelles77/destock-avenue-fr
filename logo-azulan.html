<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo AZULAN</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        .logo-container {
            text-align: center;
        }
        svg {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" width="1000" height="500">
            <!-- Flèche courbée du haut - courbe fluide -->
            <path d="M 120 180 C 300 80, 650 100, 800 180" stroke="#ff3333" stroke-width="35" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

            <!-- Pointe flèche haut - triangle pointu -->
            <polygon points="820,165 880,180 800,210" fill="#ff3333"/>

            <!-- Flèche courbée du bas - courbe fluide inverse -->
            <path d="M 800 320 C 650 400, 300 420, 120 320" stroke="#ff3333" stroke-width="35" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

            <!-- Pointe flèche bas - triangle pointu -->
            <polygon points="100,305 20,320 140,290" fill="#ff3333"/>

            <!-- Texte AZULAN - blanc/gris clair comme l'original -->
            <text x="420" y="270" font-family="Arial, sans-serif" font-size="140" font-weight="900" text-anchor="middle" fill="#ffffff" font-style="italic">AZULAN</text>

            <!-- Tagline en blanc italique -->
            <text x="500" y="410" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#ffffff" letter-spacing="2" font-style="italic">LES MEILLEURES AFFAIRES</text>
        </svg>
    </div>
</body>
</html>
