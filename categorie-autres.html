<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autres Produits - Destock Avenue FR</title>
    <style>* { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --bg: #ffffff; --bg-alt: #f5f5f5; --text: #1a1a1a; --text-light: #666;
                --border: #e0e0e0; --primary: #ff2e2e; --accent: #ffd700; }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #0f0f0f; --bg-alt: #1a1a1a; --text: #ffffff; --text-light: #aaa; --border: #333; }
        }
        body { font-family: Arial, sans-serif; background: var(--bg); color: var(--text); }
        header { background: white; padding: 1rem 2rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: bold; color: var(--primary); }
        nav { background: #000; color: white; padding: 0.75rem 2rem; display: flex; gap: 2rem; }
        nav a { color: white; text-decoration: none; font-size: 0.95rem; transition: color 0.2s; }
        nav a:hover { color: var(--primary); }
        .container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
        .category-title { font-size: 2rem; margin-bottom: 2rem; font-weight: bold; }
        .filters-section { display: grid; grid-template-columns: 250px 1fr; gap: 2rem; }
        .sidebar { background: var(--bg-alt); padding: 1.5rem; border-radius: 8px; height: fit-content; }
        .filter-group { margin-bottom: 1.5rem; }
        .filter-group h4 { font-size: 0.95rem; margin-bottom: 0.8rem; font-weight: bold; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 1.5rem; }
        .product-card { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--bg); transition: all 0.3s; }
        .product-card:hover { box-shadow: 0 8px 16px rgba(0,0,0,0.1); transform: translateY(-4px); }
        .product-image { width: 100%; height: 200px; background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
                        display: flex; align-items: center; justify-content: center; color: white; font-size: 0.85rem; text-align: center; padding: 1rem; position: relative; }
        .product-badge { position: absolute; top: 10px; right: 10px; background: var(--accent); color: black;
                        padding: 0.4rem 0.8rem; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
        .product-info { padding: 1rem; }
        .product-name { font-size: 0.95rem; font-weight: bold; margin-bottom: 0.5rem; line-height: 1.3; min-height: 2.6rem; }
        .product-price { display: flex; gap: 0.8rem; align-items: center; margin-bottom: 0.8rem; }
        .price-current { font-size: 1.3rem; font-weight: bold; color: var(--primary); }
        .price-original { text-decoration: line-through; color: var(--text-light); font-size: 0.9rem; }
        .stock-available { color: #51cf66; }
        .add-to-cart { width: 100%; padding: 0.75rem; background: var(--primary); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <div class="logo">🔴 destock.</div>
        <button class="menu-toggle" onclick="toggleMenu()">☰</button>
        <nav id="menu">
            <a href="index.html">Accueil</a>
            <a href="categorie-aspirateurs.html">Aspirateurs</a>
            <a href="categorie-cafetiere.html">Cafetières</a>
            <a href="categorie-airfryer.html">Air Fryers</a>
            <a href="categorie-robots.html">Robots</a>
            <a href="categorie-electromenager.html">Électroménager</a>
            <a href="categorie-autres.html">Autres</a>
            <a href="panier.html">🛒 Panier (<span id="cart-count">0</span>)</a>
        </nav>
    </header>
    <div class="container">
        <h1 class="category-title">Autres Produits (222)</h1>
        <div class="filters-section">
            <div class="sidebar">
                <div class="filter-group"><h4>Catégories</h4>
                    <label><input type="checkbox"> Nettoyeurs Vapeur</label>
                    <label><input type="checkbox"> Aspirateurs Eau</label>
                </div>
            </div>
            <div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <div>222 produits trouvés</div>
                </div>
                <div class="products-grid">
                    <div class="product-card">
                        <div class="product-image">Nettoyeur Bissell<div class="product-badge">-31%</div></div>
                        <div class="product-info">
                            <div class="product-name">BISSELL HydroSteam</div>
                            <div class="product-price"><span class="price-current">322€</span><span class="price-original">468€</span></div>
                            <div class="stock-available">✓ 3 en stock</div>
                            <button class="add-to-cart">Ajouter</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        function toggleMenu() {
            const menu = document.getElementById('menu');
            menu.classList.toggle('active');
        }
        document.querySelectorAll('#menu a').forEach(link => {
            link.addEventListener('click', () => {
                document.getElementById('menu').classList.remove('active');
            });
        });

        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const count = cart.reduce((sum, item) => sum + item.qty, 0);
            const countElement = document.getElementById('cart-count');
            if (countElement) countElement.textContent = count;
        }

        function addToCart(id, name, price) {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const existing = cart.find(item => item.id === id);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({id, name, price, qty: 1});
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
            alert(name + ' ajouté au panier ! ✅');
        }

        updateCartCount();
    </script>
</body>
</html>
