<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement Annulé - Destock Avenue FR</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --bg: #ffffff; --bg-alt: #f5f5f5; --text: #1a1a1a; --text-light: #666;
                --border: #e0e0e0; --primary: #ff2e2e; --accent: #ffd700; }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #0f0f0f; --bg-alt: #1a1a1a; --text: #ffffff;
                   --text-light: #aaa; --border: #333; }
        }
        body { font-family: Arial, sans-serif; background: var(--bg); color: var(--text); }
        header { background: white; padding: 0.75rem 1rem; border-bottom: 1px solid var(--border);
                display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.2rem; font-weight: bold; color: var(--primary); }
        .container { max-width: 600px; margin: 3rem auto; padding: 2rem 1rem; text-align: center; }
        .cancel-box { background: var(--bg-alt); padding: 3rem; border-radius: 8px; margin: 2rem 0; }
        .cancel-icon { font-size: 4rem; margin-bottom: 1rem; }
        h1 { margin-bottom: 1rem; color: var(--primary); }
        p { margin-bottom: 1.5rem; color: var(--text-light); line-height: 1.6; }
        .btn { background: var(--primary); color: white; padding: 1rem 2rem; border: none;
               border-radius: 4px; cursor: pointer; font-weight: bold; text-decoration: none;
               display: inline-block; margin: 0.5rem; }
        .btn:hover { background: #e60000; }
        .btn-alt { background: var(--text-light); color: white; }
        .btn-alt:hover { background: var(--text); }
    </style>
</head>
<body>
    <header>
        <div class="logo">🔴 destock.</div>
        <a href="index.html" style="text-decoration: none; color: var(--primary);">← Accueil</a>
    </header>

    <div class="container">
        <div class="cancel-box">
            <div class="cancel-icon">❌</div>
            <h1>Paiement Annulé</h1>
            <p>Votre paiement a été annulé. Votre panier est toujours disponible.</p>
            <p>Vous pouvez continuer vos achats ou réessayer de passer commande à tout moment.</p>

            <div>
                <a href="panier.html" class="btn">Retour au Panier</a>
                <a href="index.html" class="btn btn-alt">Continuer le shopping</a>
            </div>
        </div>
    </div>
</body>
</html>
