<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement Réussi - Destock Avenue FR</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --bg: #ffffff; --bg-alt: #f5f5f5; --text: #1a1a1a; --text-light: #666;
                --border: #e0e0e0; --primary: #ff2e2e; --accent: #ffd700; }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #0f0f0f; --bg-alt: #1a1a1a; --text: #ffffff;
                   --text-light: #aaa; --border: #333; }
        }
        body { font-family: Arial, sans-serif; background: var(--bg); color: var(--text); }
        header { background: white; padding: 0.75rem 1rem; border-bottom: 1px solid var(--border);
                display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.2rem; font-weight: bold; color: var(--primary); }
        .container { max-width: 600px; margin: 3rem auto; padding: 2rem 1rem; text-align: center; }
        .success-box { background: var(--bg-alt); padding: 3rem; border-radius: 8px; margin: 2rem 0; }
        .success-icon { font-size: 4rem; margin-bottom: 1rem; }
        h1 { margin-bottom: 1rem; color: #51cf66; }
        p { margin-bottom: 1.5rem; color: var(--text-light); line-height: 1.6; }
        .order-info { background: white; padding: 1.5rem; border-radius: 8px; margin: 1.5rem 0;
                     text-align: left; border: 1px solid var(--border); }
        .info-line { display: flex; justify-content: space-between; margin-bottom: 0.8rem; }
        .btn { background: var(--primary); color: white; padding: 1rem 2rem; border: none;
               border-radius: 4px; cursor: pointer; font-weight: bold; text-decoration: none;
               display: inline-block; margin-top: 1rem; }
        .btn:hover { background: #e60000; }
    </style>
</head>
<body>
    <header>
        <div class="logo">🔴 destock.</div>
        <a href="index.html" style="text-decoration: none; color: var(--primary);">← Accueil</a>
    </header>

    <div class="container">
        <div class="success-box">
            <div class="success-icon">✅</div>
            <h1>Paiement Réussi!</h1>
            <p>Merci pour votre achat ! Votre commande a été confirmée.</p>

            <div class="order-info">
                <div class="info-line">
                    <span>Statut:</span>
                    <strong style="color: #51cf66;">Confirmée</strong>
                </div>
                <div class="info-line">
                    <span>ID Session:</span>
                    <span id="session-id" style="font-family: monospace; font-size: 0.85rem;"></span>
                </div>
            </div>

            <p>Un email de confirmation sera envoyé à votre adresse dans quelques instants.</p>
            <p>Vous pouvez suivre votre commande dans votre compte.</p>

            <a href="index.html" class="btn">Retour à l'accueil</a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session_id');
        document.getElementById('session-id').textContent = sessionId || 'N/A';
        localStorage.removeItem('cart');
    </script>
</body>
</html>
